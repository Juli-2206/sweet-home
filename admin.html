<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizar Catálogo | Sweet Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-admin.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="container nav-content">
      <div class="logo">
        <img src="Logo1.jpg" alt="Sweet Home">
      </div>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="admin-main">
    <div class="admin-container">

      <div class="admin-header">
        <div>
          <h1>Actualizar Catálogo</h1>
          <p class="admin-subtitle">Gestiona tu colección de productos</p>
        </div>
        <button class="btn-agregar" id="btnAbrirModal">+ Agregar Producto</button>
      </div>

      <div class="tabla-productos">
        <div class="tabla-header">
          <span>Producto</span>
          <span>Categoría</span>
          <span>Precio</span>
          <span class="col-acciones">Acciones</span>
        </div>
        <div id="productList"></div>
      </div>

    </div>
  </main>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Agregar Producto</h2>
        <button class="btn-cerrar" id="btnCerrarModal">&times;</button>
      </div>
      <form id="productForm">
        <div class="form-group">
          <label>Nombre del producto</label>
          <input type="text" id="nombre" placeholder="Ej: Edredón Nórdico" required>
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <input type="text" id="categoria" placeholder="Ej: Edredones">
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="descripcion" placeholder="Descripción del producto" required></textarea>
        </div>
        <div class="form-group">
          <label>Precio</label>
          <input type="number" id="precio" placeholder="Ej: 155900" required>
        </div>
        <div class="form-group">
          <label>URL de la imagen</label>
          <input type="text" id="imagen" placeholder="https://...">
        </div>
        <button type="submit" class="btn-guardar" id="btnGuardar">Guardar producto</button>
      </form>
    </div>
  </div>

  <script src="crud.js"></script>
</body>
</html>
