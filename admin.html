<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizar Catálogo | Sweet Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-admin.css">
</head>
<body>

  <!-- ===== LOGIN OVERLAY ===== -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <img src="Logo1.jpg" alt="Sweet Home">
      </div>
      <h2>Acceso al Panel</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="admin@sweethome.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <p id="loginError" class="login-error"></p>
        <button type="submit" class="btn-guardar" id="btnLoginSubmit">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="container nav-content">
      <div class="logo">
        <img src="Logo1.jpg" alt="Sweet Home">
      </div>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="ventas.html">Ventas</a>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="admin-main" id="adminMain">
    <div class="admin-container">

      <div class="admin-header">
        <div>
          <h1>Actualizar Catálogo</h1>
          <p class="admin-subtitle">Gestiona tu colección de productos</p>
        </div>
        <div class="admin-header-actions">
          <span id="usuarioNombre" class="usuario-nombre"></span>
          <button class="btn-agregar" id="btnAbrirModal">+ Agregar Producto</button>
          <button class="btn-logout" id="btnLogout">Salir</button>
        </div>
      </div>

      <div class="tabla-productos">
        <div class="tabla-header">
          <span>Producto</span>
          <span>Categoría</span>
          <span>Precio</span>
          <span class="col-acciones">Acciones</span>
        </div>
        <div id="productList"></div>
      </div>

    </div>
  </main>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Agregar Producto</h2>
        <button class="btn-cerrar" id="btnCerrarModal">&times;</button>
      </div>
      <form id="productForm">
        <div class="form-group">
          <label>Nombre del producto</label>
          <input type="text" id="nombre" placeholder="Ej: Edredón Nórdico" required>
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <div class="categoria-row">
            <select id="categoria_id">
              <option value="">Sin categoría</option>
            </select>
            <button type="button" class="btn-nueva-cat" id="btnNuevaCat" title="Nueva categoría">+</button>
          </div>
          <div class="nueva-cat-form" id="nuevaCatForm" style="display:none">
            <input type="text" id="nuevaCatNombre" placeholder="Nombre de la categoría">
            <button type="button" class="btn-guardar-cat" id="btnGuardarCat">Agregar</button>
            <button type="button" class="btn-cancelar-cat" id="btnCancelarCat">✕</button>
          </div>
          <button type="button" class="btn-gestionar-cats" id="btnGestionarCats">Gestionar categorías</button>
          <div id="listaCategorias" style="display:none" class="lista-categorias"></div>
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="descripcion" placeholder="Descripción del producto" required></textarea>
        </div>
        <div class="form-group">
          <label>Precio base <small style="color:#aaa;font-weight:400" id="precioHint">(opcional si el producto tiene variantes con precio propio)</small></label>
          <input type="number" id="precio" placeholder="Ej: 155900">
        </div>
        <div class="form-group">
          <label>Imágenes del producto <small style="color:#aaa;font-weight:400">(máx. 6)</small></label>
          <div class="imagenes-grid" id="imagenesGrid"></div>
          <p id="uploadStatus" class="upload-status"></p>
        </div>
        <div class="form-group">
          <label>Variantes <small style="color:#aaa;font-weight:400">(talla/medida, precio, stock)</small></label>
          <div class="variantes-tabla" id="variantesTabla">
            <div class="variantes-header variantes-header-3">
              <span>Talla / Medida</span>
              <span>Precio</span>
              <span>Stock</span>
              <span></span>
            </div>
            <div id="variantesRows"></div>
          </div>
          <button type="button" class="btn-add-variante" id="btnAddVariante">+ Agregar variante</button>
        </div>
        <div class="form-group">
          <label>Colores disponibles <small style="color:#aaa;font-weight:400">(opcionales, independientes de la talla)</small></label>
          <div class="colores-chips" id="coloresChips"></div>
          <div class="color-input-row">
            <input type="text" id="nuevoColor" placeholder="Ej: Azul cielo" class="input-nuevo-color">
            <button type="button" class="btn-add-color" id="btnAddColor">+ Agregar</button>
          </div>
        </div>
        <button type="submit" class="btn-guardar" id="btnGuardar">Guardar producto</button>
      </form>
    </div>
  </div>

  <!-- ===== MODAL REGISTRAR VENTA ===== -->
  <div class="modal-overlay" id="modalVenta">
    <div class="modal">
      <div class="modal-header">
        <h2>Registrar Venta</h2>
        <button class="btn-cerrar" id="btnCerrarModalVenta">&times;</button>
      </div>
      <p class="venta-producto-nombre" id="ventaProductoNombre"></p>
      <form id="ventaForm">
        <div class="form-group" id="ventaTallaGroup" style="display:none">
          <label>Talla / Medida <span class="required-star">*</span></label>
          <div class="variantes-btns" id="ventaTallaBtns"></div>
        </div>
        <div class="form-group" id="ventaColorGroup" style="display:none">
          <label>Color (opcional)</label>
          <div class="variantes-btns" id="ventaColorBtns"></div>
        </div>
        <div class="form-group">
          <label>Precio de venta</label>
          <input type="number" id="ventaPrecio" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label>Cantidad</label>
          <input type="number" id="ventaCantidad" value="1" min="1">
        </div>
        <div class="form-group">
          <label>Notas <small style="color:#aaa;font-weight:400">(opcional)</small></label>
          <input type="text" id="ventaNotas" placeholder="Ej: Pago en efectivo">
        </div>
        <p id="ventaError" style="color:#d94f4f;font-size:0.83rem;min-height:1rem;font-family:'Poppins',sans-serif;"></p>
        <button type="submit" class="btn-guardar" id="btnGuardarVenta">Registrar venta</button>
      </form>
    </div>
  </div>

  <!-- ===== MODAL CONFIRMACIÓN ===== -->
  <div class="modal-overlay" id="modalConfirm">
    <div class="modal modal-confirm-box">
      <p class="confirm-mensaje" id="confirmMensaje"></p>
      <div class="confirm-acciones">
        <button class="btn-confirm-cancelar" id="btnConfirmCancelar">Cancelar</button>
        <button class="btn-confirm-aceptar"  id="btnConfirmAceptar">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="crud.js"></script>
</body>
</html>
